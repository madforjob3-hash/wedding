<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<title>로그인 - 유튜브 웹툰 캡처</title>
<style>
  :root {
    --bg: #0e0f13; --card: #171922; --card-2: #1f2230; --line: #2a2e3d;
    --text: #e8eaf0; --muted: #8b90a3; --accent: #ff4d6d; --accent-dim: #7a2637;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
  }
  .wrap { width: 100%; max-width: 380px; }
  .logo { font-size: 34px; text-align: center; margin-bottom: 12px; }
  h1 { font-size: 19px; font-weight: 700; margin: 0 0 6px; text-align: center; letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 22px; text-align: center; line-height: 1.5; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
  input[type=password] {
    width: 100%; background: var(--card-2); border: 1px solid var(--line);
    border-radius: 10px; color: var(--text); font-size: 16px; padding: 13px 14px;
    outline: none; transition: border-color .15s;
  }
  input[type=password]:focus { border-color: var(--accent); }
  button {
    width: 100%; margin-top: 14px; background: var(--accent); color: #fff;
    border: 0; border-radius: 10px; font-size: 15px; font-weight: 700;
    padding: 15px; cursor: pointer; transition: opacity .15s;
  }
  button:hover:not(:disabled) { opacity: .9; }
  button:disabled { background: var(--accent-dim); color: #c9a2ac; cursor: not-allowed; }
  .err {
    margin-top: 14px; background: rgba(255,77,109,.09); border: 1px solid #5a2530;
    color: #ffb3c0; border-radius: 10px; padding: 12px 14px;
    font-size: 13px; line-height: 1.55;
  }
  .hint { margin-top: 16px; font-size: 11px; color: #6b7085; line-height: 1.6; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">🎬</div>
  <h1>유튜브 웹툰 캡처</h1>
  <p class="sub">개인 서버입니다. 비밀번호를 입력하세요.</p>

  <div class="card">
    <form method="post" action="/login" autocomplete="on">
      <label for="pw">비밀번호</label>
      <input id="pw" name="password" type="password" autocomplete="current-password"
             autofocus {% if locked %}disabled{% endif %}>
      <button type="submit" {% if locked %}disabled{% endif %}>로그인</button>
      {% if error %}<div class="err">{{ error }}</div>{% endif %}
    </form>
  </div>

  <p class="hint">비밀번호를 잊었다면 맥미니 터미널에서<br><code>python3 app.py --set-password</code></p>
</div>
</body>
</html>
